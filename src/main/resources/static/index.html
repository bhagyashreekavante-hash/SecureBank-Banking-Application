<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Application</title>
    <link rel="stylesheet" href="style.css">
	
</head>
<body >

<header>
    <h1>🏦SecureBank</h1>
</header>

<main class="container">
    <h2>Welcome to your Dashboard</h2>

    <div class="grid">

        <section class="card">
            <h3>Create Account</h3>
            <form id="createForm">
                <input id="accountHolderName"
                       placeholder="Account Holder Name" required>

                <input id="balance" type="number"
                       min="0" step="0.01"
                       placeholder="Initial Balance" required>

                <button type="submit">Create Account</button>
            </form>
        </section>

        <section class="card">
            <h3>Get Account By ID</h3>
            <form id="getForm">
                <input id="getId" type="number" min="1"
                       placeholder="Account ID" required>
                <button type="submit">Get Account</button>
            </form>
            <div id="accountDetails"></div>
        </section>

        <section class="card">
            <h3>Deposit Money</h3>
            <form id="depositForm">
                <input id="depositId" type="number" min="1"
                       placeholder="Account ID" required>
                <input id="depositAmount" type="number" min="0.01"
                       step="0.01" placeholder="Amount" required>
                <button type="submit">Deposit</button>
            </form>
        </section>

        <section class="card">
            <h3>Withdraw Money</h3>
            <form id="withdrawForm">
                <input id="withdrawId" type="number" min="1"
                       placeholder="Account ID" required>
                <input id="withdrawAmount" type="number" min="0.01"
                       step="0.01" placeholder="Amount" required>
                <button type="submit">Withdraw</button>
            </form>
        </section>

        <section class="card">
            <h3>Delete Account</h3>
            <form id="deleteForm">
                <input id="deleteId" type="number" min="1"
                       placeholder="Account ID" required>
                <button type="submit" class="delete-btn">
                    Delete Account
                </button>
            </form>
        </section>

    </div>

    <section class="card accounts">
        <h3>All Accounts</h3>
        <button id="loadAccounts" type="button">
            Get All Accounts
        </button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Account ID</th>
                        <th>Account Holder Name</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="accountsTable">
                    <tr>
                        <td colspan="3">Click Get All Accounts to load data.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <p id="message" role="status"></p>
</main>

<script src="script.js"></script>
</body>
</html>
